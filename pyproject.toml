[project]
name = "hello-agents"
version = "0.1.0"
description = "用于学习 AI Agent 开发基础与实践的 Python 项目"
readme = "README.md"
authors = [{ name = "febel", email = "ross@ross" }]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "logfire>=5.1.0",
    "openai>=3.8.0",
    "pydantic>=2.13.5",
    "pydantic-ai>=2.43.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "serpapi>=1.1.1",
    "tavily-python>=0.8.1",
    "torch>=2.14.0",
]

[dependency-groups]
dev = ["ruff>=0.16.6"]
